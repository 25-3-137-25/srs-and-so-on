{% load static %}

<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Управление заявками</title>

    <link rel="stylesheet"
          href="{% static 'vendor/tabler/css/tabler.min.css' %}">
</head>

<body>
<div class="page">
    <div class="page-wrapper">
        <div class="container-xl py-4">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h1 class="mb-0">Центр управления заявками</h1>
                <div class="d-flex align-items-center gap-3">
                    <span>{{ request.user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-secondary" type="submit">Выйти</button>
                    </form>
                </div>
            </div>

            {% csrf_token %}

            <div id="message" role="status"
                 aria-live="polite"></div>

            <div class="card mb-4">
                <div class="card-body">
                    <form id="ticket-form">
                        <div class="mb-3">
                            <label class="form-label" for="title">
                                Название заявки
                            </label>
                            <input id="title"
                                   class="form-control"
                                   minlength="5"
                                   maxlength="200"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Описание</label>
                            <textarea id="description" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="category">
                                Категория
                            </label>
                            <select id="category"
                                    class="form-select"
                                    required></select>
                        </div>

                        <button id="create-ticket" class="btn btn-primary"
                                type="submit" disabled>
                            Создать заявку
                        </button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Список заявок</h2>
                </div>

                <div class="card-body">
                    <p class="text-secondary">Статус меняется по порядку: Новая → В работе → Выполнена.</p>
                    <label class="form-label" for="status-filter">Фильтр по статусу</label>
                    <select id="status-filter"
                            class="form-select mb-3">
                        <option value="">Все статусы</option>
                        <option value="new">Новые</option>
                        <option value="progress">В работе</option>
                        <option value="done">Выполненные</option>
                    </select>

                    <div id="loading" hidden>
                        Загрузка данных...
                    </div>

                    <button id="refresh-tickets" class="btn btn-outline-secondary mb-3" type="button">Обновить список</button>
                    <div id="tickets-list" aria-busy="false"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="{% static 'tickets/app.js' %}"></script>
</body>
</html>
