{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · Управление заявками</title>
    <link rel="stylesheet" href="{% static 'vendor/tabler/css/tabler.min.css' %}">
</head>
<body>
<main class="page page-center">
    <div class="container container-tight py-4">
        <h1 class="text-center mb-4">Центр управления заявками</h1>
        <div class="card card-md">
            <div class="card-body">
                <h2 class="h2 text-center mb-4">Вход в аккаунт</h2>
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Неверное имя пользователя или пароль. Проверьте данные и повторите попытку.
                        </div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label" for="username">Имя пользователя</label>
                        <input id="username" name="username" class="form-control"
                               value="{{ form.username.value|default_if_none:'' }}"
                               autocomplete="username" maxlength="150" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Пароль</label>
                        <input id="password" name="password" type="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Войти</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
